<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | AJA RETRO</title>
    
    <script src="/js/tailwind.js"></script>
    <script src="/js/alpine.js" defer></script>
    <script src="/js/lucide.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-red': '#EF4444',
                        'brand-dark': '#09090b',
                        'brand-card': '#121214',
                        'brand-border': '#222226'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
    </style>
</head>
<body class="bg-brand-dark text-slate-100 font-sans selection:bg-brand-red selection:text-white overflow-x-hidden min-h-screen flex flex-col justify-between" x-data="{ mobileMenuOpen: false }">

    <!-- Nav Bar -->
    <nav class="fixed top-0 w-full z-50 bg-brand-dark/80 backdrop-blur-xl border-b border-brand-border py-4 px-6 md:px-12">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="/index.html" class="text-2xl font-extrabold tracking-tighter uppercase italic"><span class="text-brand-red">AJA</span>RETRO</a>
            </div>
            
            <!-- Desktop Links -->
            <div class="hidden md:flex items-center gap-10 font-bold text-xs uppercase tracking-widest text-slate-400">
                <a href="/index.html" class="hover:text-white transition">Home</a>
                <a href="/about.html" class="hover:text-white transition">About</a>
                <a href="/services.html" class="hover:text-white transition">Services</a>
                <a href="/cover.html" class="hover:text-white transition">Covers</a>
            </div>

            <!-- Mobile Menu Toggle -->
            <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden text-slate-300 hover:text-white focus:outline-none">
                <i data-lucide="menu" class="w-6 h-6" x-show="!mobileMenuOpen"></i>
                <i data-lucide="x" class="w-6 h-6" x-show="mobileMenuOpen"></i>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div x-show="mobileMenuOpen" x-transition.opacity class="absolute top-full left-0 w-full bg-brand-dark border-b border-brand-border py-6 px-8 flex flex-col gap-6 font-bold text-sm uppercase tracking-widest text-slate-400 z-50 shadow-2xl" style="display: none;">
            <a href="/index.html" class="hover:text-white transition">Home</a>
            <a href="/about.html" class="hover:text-white transition">About</a>
            <a href="/services.html" class="hover:text-white transition">Services</a>
            <a href="/cover.html" class="hover:text-white transition">Covers</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center text-center pt-32">
        <div class="container mx-auto px-4 py-16">
            <div x-data="{ currentImg: Math.floor(Math.random() * 2), images: ['https://i.imgflip.com/a3v4va.jpg', '/images.jpeg'] }" class="max-w-md mx-auto relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-brand-red to-zinc-800 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                <img :src="images[currentImg]" alt="404 Meme" class="relative w-full rounded-2xl border border-brand-border shadow-2xl transition-all duration-300 cursor-pointer hover:scale-[1.01]" @click="currentImg = (currentImg + 1) % images.length">
                <div class="absolute bottom-4 right-4 bg-brand-dark/75 backdrop-blur-md px-3 py-1.5 rounded-xl border border-brand-border text-[9px] uppercase font-mono font-bold tracking-wider text-slate-400 pointer-events-none select-none">
                    Click to switch meme
                </div>
            </div>
            <h1 class="text-6xl md:text-8xl font-black text-white mt-12 italic uppercase tracking-tighter">404</h1>
            <p class="text-xl md:text-2xl text-brand-red font-black italic uppercase tracking-wider mt-2">Page Not Found</p>
            <p class="text-slate-400 mt-6 max-w-lg mx-auto text-sm leading-relaxed">
                Looks like you're as lost as our hope was during that cricket match. The page you're looking for doesn't exist.
            </p>
            <a href="/index.html" class="mt-10 inline-block bg-brand-red hover:bg-red-600 text-white font-bold py-3.5 px-8 rounded-2xl text-xs uppercase tracking-widest shadow-lg shadow-brand-red/20 transition-all duration-300 transform hover:-translate-y-0.5">
                Go Back Home
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 border-t border-brand-border bg-brand-dark">
        <div class="container mx-auto px-4 text-center text-zinc-500 text-xs font-mono uppercase tracking-wider">
            <p>&copy; 2026 AJA RETRO. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // Initialize lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
