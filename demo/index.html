<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroMail Secure Login - Demo Mode</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top right, #3b0712, #080203);
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(22, 25, 32, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-panel:hover {
            box-shadow: 0 12px 48px 0 rgba(220, 38, 38, 0.15);
        }
        .glass-input {
            background: rgba(15, 17, 23, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-input:focus {
            border-color: #dc2626;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.25);
            background: rgba(15, 17, 23, 0.9);
        }
        .glass-input:invalid:not(:placeholder-shown) {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
        }
        [v-cloak] {
            display: none;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md mx-auto" v-cloak>
        <!-- Demo Banner -->
        <div class="bg-gradient-to-r from-amber-600/30 to-red-600/30 border border-amber-500/20 text-amber-200 text-xs px-4 py-3 rounded-t-2xl text-center font-bold flex items-center justify-center gap-2 relative z-10 glass-panel border-b-0">
            <i class="fa-solid fa-flask-vial text-sm animate-pulse text-amber-400"></i>
            <span>Interactive Web Panel Demo</span>
        </div>

        <div class="glass-panel rounded-b-2xl rounded-t-none p-8 flex flex-col gap-6">
            <div class="text-center flex flex-col items-center justify-center">
                <h1 class="font-outfit text-4xl font-extrabold tracking-wider leading-none text-white"><span class="text-red-600">{{ branding.serverName || 'AJA RETRO' }}</span></h1>
                <p class="text-gray-400 text-xs font-semibold uppercase tracking-widest mt-2">{{ branding.serverName || 'RetroMail' }} Secure Portal</p>
            </div>
            
            <div v-if="errorMsg" class="bg-red-950/60 border border-red-800 text-red-300 p-3 rounded-lg text-sm text-center flex items-center justify-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ errorMsg }}
            </div>

            <!-- Credentials Box -->
            <div class="bg-slate-900/60 border border-white/5 p-4 rounded-xl text-xs space-y-2">
                <div class="font-bold text-gray-300 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-red-500"></i> Demo Credentials:
                </div>
                <div class="flex justify-between items-center bg-black/30 p-2 rounded border border-white/5">
                    <div>
                        <span class="text-red-400 font-semibold">Admin Account:</span>
                        <code class="text-slate-300 font-mono ml-1">admin</code>
                    </div>
                    <div>
                        <span class="text-gray-500">Password:</span>
                        <code class="text-slate-300 font-mono ml-1">admin123</code>
                    </div>
                </div>
                <div class="flex justify-between items-center bg-black/30 p-2 rounded border border-white/5">
                    <div>
                        <span class="text-emerald-400 font-semibold">Staff Account:</span>
                        <code class="text-slate-300 font-mono ml-1">staff</code>
                    </div>
                    <div>
                        <span class="text-gray-500">Password:</span>
                        <code class="text-slate-300 font-mono ml-1">staff123</code>
                    </div>
                </div>
            </div>
 
            <form @submit.prevent="handleLogin" class="flex flex-col gap-4">
                <div>
                    <label class="block text-gray-400 text-xs font-semibold mb-2 uppercase tracking-wider">Username</label>
                    <input type="text" v-model="loginForm.username" required maxlength="16" pattern="^[a-zA-Z0-9_-]{3,16}$" title="Username must be 3-16 characters and contain only alphanumeric, dashes, or underscores" class="w-full glass-input rounded-xl px-4 py-3 text-sm" placeholder="Enter username...">
                </div>
                <div>
                    <label class="block text-gray-400 text-xs font-semibold mb-2 uppercase tracking-wider">Password</label>
                    <input type="password" v-model="loginForm.password" required maxlength="128" class="w-full glass-input rounded-xl px-4 py-3 text-sm" placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-gray-400 text-xs font-semibold mb-2 uppercase tracking-wider">2FA Token (Optional)</label>
                    <input type="text" v-model="loginForm.totpCode" maxlength="6" pattern="^[0-9]{6}$" title="2FA token must be a 6-digit number" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-center tracking-widest" placeholder="123456">
                </div>
                <button type="submit" :disabled="loading" class="w-full bg-gradient-to-r from-red-600 to-red-800 hover:from-red-700 hover:to-red-900 disabled:opacity-50 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-red-950/40 text-sm mt-2">
                    <span v-if="loading"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Logging in...</span>
                    <span v-else>Login Portal <i class="fa-solid fa-arrow-right ml-1"></i></span>
                </button>
            </form>
            
            <div class="border-t border-white/5 pt-4 mt-2 flex justify-center gap-4 text-xs font-semibold text-gray-500">
                <a href="https://discord.gg/ajaretro" target="_blank" class="hover:text-slate-300 transition"><i class="fa-brands fa-discord"></i> Discord</a>
                <a href="../retromail.html" class="hover:text-slate-300 transition"><i class="fa-solid fa-left-long"></i> Back to Site</a>
                <a href="https://patreon.com/AJA_RETRO" target="_blank" class="hover:text-slate-300 transition"><i class="fa-solid fa-heart text-red-500"></i> Donate</a>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const errorMsg = ref('');
                const loading = ref(false);
                const tokenKey = 'retromail_token';
                const branding = ref({
                    serverName: 'RetroMail Demo',
                    discordLink: 'https://discord.gg/ajaretro',
                    documentationLink: '',
                    forumLink: ''
                });

                const loginForm = ref({
                    username: '',
                    password: '',
                    totpCode: ''
                });

                const initializeDemoData = () => {
                    if (localStorage.getItem('retromail_initialized')) return;

                    const defaultMails = [
                        {
                            id: 1,
                            mailFrom: "system@paper.io <System Monitor>",
                            mailTo: "admin@ajaretro.dev",
                            subject: "[Alert] High MSPT Detected on Survival Server",
                            body: "<body style=\"font-family: sans-serif; color: #cbd5e1; background-color: #0b0f19; padding: 15px;\"><p>Hi Niloy,</p><p>The MSPT on <b style=\"color: #f87171;\">Survival Server</b> has spiked to <b style=\"color: #ef4444;\">65.4ms</b>. CircuitBreaker has quarantined chunk (x: -145, z: 2309) to restore server stability.</p><p>Check the admin logs for details.</p></body>",
                            isHtml: true,
                            receivedAt: "2026-06-26 12:00:00"
                        },
                        {
                            id: 2,
                            mailFrom: "support@mojang.com <Mojang Security>",
                            mailTo: "niloy@ajaretro.dev",
                            subject: "Minecraft Account Association Code",
                            body: "Please submit the verification token below to associate your Minecraft account Niloy with this email address:\n\nToken: RM-8492-AX\n\nIf you did not request this, please ignore this email.",
                            isHtml: false,
                            receivedAt: "2026-06-26 11:30:00"
                        },
                        {
                            id: 3,
                            mailFrom: "billing@pterodactyl.co <Pterodactyl Billing>",
                            mailTo: "admin@ajaretro.dev",
                            subject: "Invoice #84920 - Processed",
                            body: "<body style=\"font-family: sans-serif; color: #cbd5e1; background-color: #0b0f19; padding: 15px;\"><p>Dear Niloy,</p><p>Your payment of <b>$24.99 USD</b> for server node hosting has been processed successfully.</p><p>Thank you for choosing AJA RETRO hosting.</p></body>",
                            isHtml: true,
                            receivedAt: "2026-06-26 09:15:00"
                        },
                        {
                            id: 4,
                            mailFrom: "admin@ajaretro.dev (Outbound)",
                            mailTo: "staff@ajaretro.dev",
                            subject: "Web Panel Staff Credentials",
                            body: "Hi staff, here are your dashboard access credentials. Please login at https://ajaretro.dev/demo/ using username 'staff' and password 'staff123'. Remember to set up 2FA.",
                            isHtml: false,
                            receivedAt: "2026-06-26 08:00:00"
                        }
                    ];

                    const defaultStaff = [
                        {
                            username: "admin",
                            email: "admin@ajaretro.dev",
                            role: "ADMIN",
                            totpEnabled: false,
                            permissions: ["support@ajaretro.dev", "info@ajaretro.dev", "help@ajaretro.dev"],
                            filters: []
                        },
                        {
                            username: "staff",
                            email: "staff@ajaretro.dev",
                            role: "STAFF",
                            totpEnabled: true,
                            permissions: ["support@ajaretro.dev"],
                            filters: [{"mailbox": "support@ajaretro.dev", "allowedSender": "*@gmail.com"}]
                        }
                    ];

                    const defaultTokens = [
                        {
                            id: 1,
                            name: "Pterodactyl Hook",
                            permissions: "read_mails,send_mails",
                            token: "pt_8492019a3b2c1d0e"
                        }
                    ];

                    localStorage.setItem('retromail_mails', JSON.stringify(defaultMails));
                    localStorage.setItem('retromail_staff', JSON.stringify(defaultStaff));
                    localStorage.setItem('retromail_tokens', JSON.stringify(defaultTokens));
                    localStorage.setItem('retromail_initialized', 'true');
                };

                const handleLogin = async () => {
                    errorMsg.value = '';
                    loading.value = true;
                    setTimeout(() => {
                        const user = loginForm.value.username.trim().toLowerCase();
                        const pass = loginForm.value.password;
                        
                        if (user === 'admin' && pass === 'admin123') {
                            localStorage.setItem(tokenKey, 'mock_token_admin');
                            localStorage.setItem('retromail_profile', JSON.stringify({
                                username: 'admin',
                                email: 'admin@ajaretro.dev',
                                role: 'ADMIN',
                                avatarPath: '',
                                tempPassword: false,
                                totpEnabled: false
                            }));
                            window.location.href = 'inbox.html';
                        } else if (user === 'staff' && pass === 'staff123') {
                            localStorage.setItem(tokenKey, 'mock_token_staff');
                            localStorage.setItem('retromail_profile', JSON.stringify({
                                username: 'staff',
                                email: 'staff@ajaretro.dev',
                                role: 'STAFF',
                                avatarPath: '',
                                tempPassword: false,
                                totpEnabled: true
                            }));
                            window.location.href = 'inbox.html';
                        } else {
                            errorMsg.value = 'Invalid username or password. Check the credentials displayed above!';
                            loading.value = false;
                        }
                    }, 600);
                };

                onMounted(() => {
                    initializeDemoData();
                    const token = localStorage.getItem(tokenKey);
                    if (token) {
                        window.location.href = 'inbox.html';
                    }
                });

                return {
                    errorMsg,
                    loading,
                    loginForm,
                    branding,
                    handleLogin
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
